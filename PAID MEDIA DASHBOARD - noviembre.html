.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--navbg);border-right:1px solid var(--line);padding:14px 0;position:sticky;top:0;height:100vh;overflow:auto;backdrop-filter:blur(6px)}
nav h2{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:4px 18px 10px;font-weight:700}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 18px;font:inherit;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;border-left:4px solid transparent;letter-spacing:.02em}
nav .navgrp{margin:0 0 4px 18px;border-left:2px solid var(--club-green)}
nav .navgrp button.child{padding:9px 16px;font-size:13px;font-weight:500;border-left:0}
nav .navgrp button.child.on{background:var(--green-l);box-shadow:inset 3px 0 0 var(--club-gold)}
nav .navlabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 18px 4px;padding-top:10px;border-top:1px solid var(--line)}
nav button:hover{background:var(--green-l);color:var(--ink)}
nav button.on{background:var(--green-l);border-left-color:var(--club-gold);color:var(--ink)}
nav .newtag{font-size:10px;background:var(--club-gold);color:#fff;border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:middle}
main{padding:18px 26px 40px;min-width:0}
header.top{position:sticky;top:0;z-index:20;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;background:var(--hbg);border:1px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.brand{display:flex;gap:16px;align-items:center}
.shield{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.96);padding:6px;display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px var(--line),0 0 18px var(--cardglow)}
.shield img{width:100%;height:100%;object-fit:contain}
.titles .kick{font-size:11px;letter-spacing:.16em;color:var(--green-d);font-weight:700;text-transform:uppercase}
.titles h1{margin:2px 0 0;font-family:var(--font-thin);font-weight:300;font-size:30px;line-height:1.05;color:var(--ink);letter-spacing:.03em;text-transform:uppercase}
.titles .sec{font-family:var(--font-fig);font-size:24px;line-height:1.1;letter-spacing:.04em;text-transform:uppercase;color:var(--club-gold);text-shadow:0 0 18px var(--glow)}
.titles .temp{font-size:13px;margin-top:2px;color:var(--muted)}
.tools{display:flex;gap:10px;align-items:center}
.ver{font-size:12px;color:var(--muted);text-align:right}
.ver b{background:var(--club-green);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px}
.ibtn{display:grid;place-items:center;border:1px solid var(--line);background:var(--chipbg);color:var(--ink);border-radius:10px;width:38px;height:38px;cursor:pointer;line-height:1}
.ibtn svg{fill:none}
.ibtn:hover{border-color:var(--club-gold)}
.filters{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.filters .grp{display:flex;flex-direction:column;gap:5px;min-width:0}
.filters label{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--green-d);text-transform:uppercase}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chipbg);border-radius:16px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--club-gold)}
.chip.on{background:var(--club-green);border-color:var(--club-green);color:#fff;font-weight:600}
.chip[disabled]{opacity:.35;cursor:not-allowed}
.chip.plat{display:inline-flex;align-items:center;border-color:color-mix(in srgb,var(--nc) 60%,transparent);transition:box-shadow .15s,background .15s}
.chip.plat:hover{border-color:var(--nc);box-shadow:0 0 12px var(--ncg)}
.chip.plat.on{background:color-mix(in srgb,var(--nc) 20%,transparent);border-color:var(--nc);color:var(--ink);box-shadow:0 0 0 1.5px var(--nc),0 0 18px var(--ncg)}
.neon{filter:none}

.chip .lg{margin-right:6px;margin-top:-2px}
.tag{border:1px solid var(--club-gold);background:rgba(207,138,0,.16);color:var(--ink);border-radius:16px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.tag b{color:var(--gold-t);font-weight:700}
.tag:hover{background:rgba(207,138,0,.3)}
select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;max-width:420px;min-width:200px;background:var(--chipbg);color:var(--ink)}
select option{background:#0a1f14;color:#f2f7f4}
:root[data-theme="light"] select option{background:#fff;color:#0B1F16}
.reset{border:0;background:none;color:var(--green-d);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:6px}
.hint{font-size:12px;color:var(--muted);margin:-6px 2px 12px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(340px,410px) 1fr 1fr;align-items:start}
.kpis{grid-column:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpis.k4 .kpi.wide,.kpis.k6 .kpi.wide{grid-column:span 2}
.right{grid-column:2 / span 2;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1 / -1}
.kpi{background:radial-gradient(120% 90% at 50% 0%,var(--cardglow),transparent 70%),var(--surface);border:1px solid var(--line);border-top:3px solid var(--club-green);border-radius:12px;padding:12px 10px 14px;text-align:center;min-height:116px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.kpi h4{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.kpi .val{font-family:var(--font-fig);font-weight:400;font-size:40px;line-height:1.08;letter-spacing:.02em;white-space:nowrap;color:var(--gold-t);text-shadow:0 0 16px var(--glow);font-variant-numeric:tabular-nums}
.kpi.soft .val{color:var(--ink);text-shadow:none}
.kpi small{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.card>h3{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--font-thin);font-weight:300;font-size:20px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);padding:11px 16px 9px;border-bottom:1px solid var(--line)}
.card>h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--club-gold);box-shadow:0 0 8px var(--club-gold);flex:none}
.card .body{padding:12px 14px}
.empty{padding:34px 14px;text-align:center;color:var(--muted);font-size:15px}
svg{fill:var(--ink)}
svg text{font-family:inherit}
svg text.fig{font-family:var(--font-fig);font-weight:400;fill:var(--gold-t);letter-spacing:.02em}
[data-x]{cursor:pointer}
.lg{vertical-align:middle;flex:none;border-radius:5px}
.donutwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.legend{list-style:none;margin:0;padding:0;font-size:14px;display:grid;gap:6px}
.legend li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:2px 4px;border-radius:6px}
.legend li[data-x]:hover{background:var(--green-l)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend span.v{color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.banner{background:var(--banbg);border:1px solid var(--banbd);color:var(--bantx);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner.bad{background:var(--badbg);border-color:var(--badbd);color:var(--badtx)}
details.detail{margin-top:16px}
details.detail summary{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;color:var(--green-d)}
details.detail[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.tablewrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
details.ins{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold-t);border-radius:12px;margin:0 0 16px}
details.ins summary{cursor:pointer;padding:10px 14px;font-family:"Oswald",sans-serif;font-weight:300;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-t)}
details.ins ul{margin:0;padding:0 18px 12px 34px;font-size:14px;line-height:1.5}
details.ins li{margin:4px 0}
details.ins li b{color:var(--gold-t)}
.scope{font-size:13px;color:var(--ink2);background:var(--green-l);border-radius:10px;padding:8px 14px;margin:0 0 12px}
details.cnt{grid-column:1 / -1}
table.cnt{width:auto;min-width:46%;margin:0 0 10px;font-size:13px}
.cntwrap{display:flex;gap:28px;flex-wrap:wrap;padding:0 18px 6px}
table.cnt td,table.cnt th{padding:5px 12px}
table.cnt tr[data-x]:hover td{background:var(--green-l)}
.tmode{margin-left:auto;display:inline-flex;gap:6px}
.trendleg{display:flex;gap:22px;padding:8px 16px 0;font-size:13px;color:var(--ink2)}
.trendleg i{display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:7px;vertical-align:middle}
.trendleg i.dash{background:none;border-top:3px dashed;height:0}
.pbar{height:10px;min-width:140px;background:var(--grid);border-radius:5px;overflow:hidden;margin-bottom:3px}
.pbar>i{display:block;height:100%}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--gold-t)}
th .arr{margin-left:5px;font-size:10px;opacity:.4}
th.on .arr{opacity:1;color:var(--gold-t)}
.linkbtn{background:none;border:0;color:var(--gold-t);font-weight:700;cursor:pointer;padding:0 0 0 8px;font:inherit;font-weight:700;text-decoration:underline}
td.name{max-width:420px;overflow:hidden;text-overflow:ellipsis}
th{background:var(--green-l);color:var(--green-d);position:sticky;top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
table.cmp td:first-child{font-weight:600}
table.cmp td.ref{font-family:var(--font-fig);font-size:20px;color:var(--gold-t);letter-spacing:.02em}
table.cmp small{text-transform:none;letter-spacing:0;font-weight:400;opacity:.8}
tr[data-camp]{cursor:pointer}
tr[data-camp]:hover td{background:var(--green-l)}
tr[data-camp].sel td{background:rgba(207,138,0,.18)}
.dl{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.dl.up{background:rgba(43,212,122,.16);color:var(--ok);border:1px solid rgba(43,212,122,.4)}
.dl.dn{background:rgba(224,82,106,.16);color:var(--bad);border:1px solid rgba(224,82,106,.45)}
.dl.nn{background:rgba(143,168,154,.14);color:var(--muted);border:1px solid var(--grid)}
tr.tot td{font-weight:700;background:var(--totbg)}
td.ok{color:var(--ok);font-weight:700} td.bad{color:var(--bad);font-weight:700}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--tipbg);color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.35);display:none;max-width:320px}
#tip b{color:#fff}
footer{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5}
@media (max-width:1180px){
  .grid{grid-template-columns:1fr}
  .kpis,.right{grid-column:1 / -1}
  .right{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav{position:static;height:auto;display:flex;overflow:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}
  nav h2{display:none}
  nav .navlabel{display:none}
  nav .navgrp{display:contents}
  nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:4px solid transparent}
  nav button.on{border-bottom-color:var(--club-gold)}
  main{padding:14px 16px 30px}
  .titles h1{font-size:22px}
  .kpi .val{font-size:34px}
}
@page{size:A4 landscape;margin:9mm}
@media print{
  html{zoom:.72}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  :root:not([data-theme="light"]) body{background-image:none}
  nav,.filters,.hint,.tools .ibtn,details.detail,#tip{display:none!important}
  details.ins{break-inside:avoid}
  .app{display:block}
  main{padding:0}
  header.top{position:static;backdrop-filter:none;margin-bottom:10px}
  *{box-shadow:none!important;backdrop-filter:none!important}
  .grid{grid-template-columns:minmax(340px,410px) 1fr 1fr!important}
  .kpis{grid-column:1!important}
  .right{grid-column:2 / span 2!important;grid-template-columns:1fr 1fr!important}
  .card,.kpi,.kpis,.right>*,.banner,.note,tr,.full{break-inside:avoid;page-break-inside:avoid}
  .card>h3{break-after:avoid;page-break-after:avoid}
  .grid,.right,.kpis{break-inside:auto}
  .tablewrap{overflow:visible}
}
</style>

/* ---------- clasificación por nombre de campaña (criterios del Power BI 25/26) ---------- */
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const has=(p,n)=>new RegExp('(?<![a-z])(?:'+p+')(?![a-z])').test(n);
const BRANDS=[['REVEL','revel'],['SPEEDYBET','speedybet'],['TRAINLINE','trainline'],['PRIMA','prima'],['GREE','gree'],['SCIENTIFIC NUTRITION','scientif+ic nutrition'],['MONSTER','monster']];
const TIPOS=[['Suscriptores','suscriptores'],['VideoViews','videoviews|visualizaciones|views'],['Followers','followers|seguidores'],['Engagement','engagement|interaccion']];
const PC={'TICKETING':'TICKETING','RETAIL':'RETAIL','SOY BETICO':'SOY BÉTICO','TOUR':'EXPERIENCIAS VIP','EXPERIENCIAS VIP':'EXPERIENCIAS VIP','FAN ENGAGEMENT':'FAN ENGAGEMENT','MEMORABILIA':'MEMORABILIA','MARCA':'MARCA','ACADEMIA':'ACADEMIA','PATROCINADOR':'PATROCINADOR','RRSS':'RRSS','LEADS':'FAN ENGAGEMENT'};
const brandOf=n=>{n=norm(n);for(const [b,p] of BRANDS) if(has(p,n)) return b;return '';};
const tipoOf=n=>{n=norm(n);for(const [t,p] of TIPOS) if(has(p,n)) return t;return '';};
/* Fan Engagement: registros de sorteos y leads (Soy Bético leads). Los patrocinadores y la academia con «registros» siguen en sus páginas. */
const isFan=name=>{const n=norm(name);return !brandOf(name)&&!has('patrocinador',n)&&!n.includes('academia')&&(has('registros?',n)||n.includes('leads'));};
function ruleProd(name,src){
  const n=norm(name);
  if(brandOf(name)||has('patrocinador',n)) return 'PATROCINADOR';
  if(n.includes('memorabilia')) return 'MEMORABILIA';
  if(has('spot',n)) return 'MARCA';
  if(n.includes('academia')) return 'ACADEMIA';
  if(has('ticketing',n)||src==='LINKEDIN') return 'TICKETING';
  if(has('retail',n)) return 'RETAIL';
  if(isFan(name)) return 'FAN ENGAGEMENT';
  if(n.includes('soybetico')||n.includes('soy betico')) return 'SOY BÉTICO';
  if(has('tour',n)||n.includes('tktk_search')) return 'EXPERIENCIAS VIP';
  if(tipoOf(name)) return 'RRSS';
  return 'SIN CLASIFICAR';
}
function classify(r){
  const fromCol=PC[norm(r.pc).toUpperCase().trim()];
  const prod=isFan(r.n)?'FAN ENGAGEMENT':(fromCol||ruleProd(r.n,r.s));
  return {...r,prod,sv0:r.sv,sv:prod==='FAN ENGAGEMENT'?0:r.sv,
    tipo:prod==='RRSS'?(tipoOf(r.n)||'Sin tipo'):'',
    pat:prod==='PATROCINADOR'?(brandOf(r.n)||'Sin asignar'):'',
    ck:r.n.toLowerCase().replace(/^prueba:\s*/,'').replace(/\s+/g,' ').trim(),
    viaRegla:!fromCol};
}
const ENR=DATA.map(classify);

const feeKpis=(rows,a)=>{const c=commOf(rows),f=c.ad+c.ot;

/* ---------- contratos de patrocinadores: límite de inversión en Paid Media ---------- */
const CONTRATOS=[
 {pat:'REVEL',limite:20000,nota:'20.000 € en Paid Media'},
 {pat:'GREE',limite:125000,nota:'Bolsa de activación de 125.000 € que incluye otros costes de activación: el Paid Media sale de esa bolsa'},
 {pat:'TRAINLINE',limite:15000,nota:'15.000 € en Paid Media'},
 {pat:'SPEEDYBET',campanas:4,extra:2,nota:'4 campañas en Meta, con posibilidad de 2 adicionales durante la temporada si hay disponibilidad y acuerdo mutuo. El contrato dice «cuatro (2)»: se interpreta de momento como 4 campañas'},
 {pat:'MONSTER',nota:'Contrato sin cantidad especificada'}];
function contractCard(){
  const all=ENR.filter(r=>r.prod==='PATROCINADOR');
  const pats=[...CONTRATOS.map(c=>c.pat),...[...new Set(all.map(r=>r.pat))].filter(x=>x&&!CONTRATOS.some(c=>c.pat===x))];
  const bar=(pc,col)=>`<div class="pbar"><i style="width:${Math.min(pc,1)*100}%;background:${col}"></i></div>`;
  let h=`<div class="tablewrap" style="border:0"><table class="cnt" style="width:100%"><thead><tr><th>Patrocinador</th><th>Contrato</th><th>Invertido (con comisión)</th><th>Uso del límite</th><th>Disponible</th></tr></thead><tbody>`;
  pats.forEach(b=>{const c=CONTRATOS.find(x=>x.pat===b),rr=all.filter(r=>r.pat===b),a=agg(rr),cm=commOf(rr),tot=a.g+cm.ad+cm.ot10;
    let ct='Sin dato de contrato',use='–',disp='–';
    if(c&&c.limite){const pc=tot/c.limite,col=pc>1?'var(--bad,#e0526a)':pc>=.75?'var(--com)':'var(--inv)';
      ct=`${eur(c.limite)}${c.pat==='GREE'?' <small>(bolsa de activación)</small>':''}`;use=`${bar(pc,col)}<small>${pct(pc,1)}</small>`;disp=eur(c.limite-tot);}
    else if(c&&c.campanas){const n=new Set(rr.filter(r=>r.s==='META').map(r=>r.ck)).size;ct=`${c.campanas} campañas en Meta <small>(+${c.extra} posibles)</small>`;
      const col=n>c.campanas?'var(--com)':'var(--inv)';use=`${bar(n/c.campanas,col)}<small>${n} de ${c.campanas} campañas${n>c.campanas?' (usa las adicionales)':''}</small>`;disp=n>=c.campanas?'Sin campañas contratadas libres':`${c.campanas-n} campañas`;}
    else if(c)ct='No especificado';
    h+=`<tr><td>${esc(b)}</td><td>${ct}</td><td>${eur(tot,2)}</td><td>${use}</td><td>${disp}</td></tr>`;});
  h+=`</tbody></table></div><p class="note" style="padding:0 14px 10px">Acumulado de la temporada 2026/27, sin tener en cuenta los filtros de la página. «Invertido» incluye la comisión de agencia que se traslada al patrocinador (8 % ADSMURAI, 10 % ON TOP). ${CONTRATOS.filter(c=>c.nota).map(c=>`<b>${c.pat}</b>: ${esc(c.nota)}.`).join(' ')} Verde por debajo del 75 %, dorado entre el 75 % y el 100 %, rojo por encima del límite. Las campañas «prueba» cuentan como inversión.</p>`;
  return card('Contrato de inversión en Paid Media por patrocinador',h,'full');
}

/* ---------- panel de conclusiones y alcance ---------- */
const chg=(a,b)=>{if(a==null||b==null||b===0)return null;const d=(a-b)/Math.abs(b);return (d>0?'+':d<0?'−':'')+grp(Math.abs(d)*100,1)+' %';};
const groupAgg=(rows,kf)=>{const m={};rows.forEach(r=>{const k=kf(r);(m[k]=m[k]||[]).push(r);});return Object.entries(m).map(([k,rr])=>({k,a:agg(rr),rr}));};
function insights(p,rows){
  const ventas=p.type==='general'||p.type==='prod',a=agg(rows),L=[];
  if(!rows.length)return '';
  const roas=ratio(a.sv,a.g),cpc=ratio(a.g,a.c),ctr=ratio(a.c,a.i);
  if(ventas)L.push(`Se han invertido <b>${eur(a.g)}</b> y se han generado <b>${eur(a.sv)}</b> en ventas: <b>${roas==null?'–':eur(roas,2)}</b> de ventas por cada € invertido (ROAS).`);
  else L.push(`Se han invertido <b>${eur(a.g)}</b> para <b>${n0(a.i)}</b> impresiones y <b>${n0(a.c)}</b> clics (CPC <b>${cpc==null?'–':eur(cpc,2)}</b>, CTR <b>${ctr==null?'–':pct(ctr,2)}</b>).${p.type==='fan'?` Han generado <b>${grp(a.p,0)}</b> conversiones (coste por conversión <b>${a.p>0?eur(a.g/a.p,2):'–'}</b>).`:' Esta página no muestra ventas.'}`);
  // mes
  const rm=rowsFor(p,['month']),ms=SEASON.filter(m=>rm.some(r=>r.m===m&&(r.g>0||r.i>0)));
  if(ms.length>=2){
    const ref=state.months.size===1&&ms.includes([...state.months][0])?[...state.months][0]:ms[ms.length-1],i=ms.indexOf(ref);
    if(i>0){const pv=ms[i-1],A=agg(rm.filter(r=>r.m===ref)),B=agg(rm.filter(r=>r.m===pv)),nm=m=>MES_LARGO[SEASON.indexOf(m)];
      const dg=chg(A.g,B.g);
      if(ventas){const r1=ratio(A.sv,A.g),r0=ratio(B.sv,B.g),dr=chg(r1,r0);
        L.push(`<b>${nm(ref)}</b> frente a ${nm(pv)}: inversión <b>${dg||'–'}</b>, ventas <b>${chg(A.sv,B.sv)||'–'}</b> y ROAS <b>${r1==null?'–':eur(r1,2)}</b> (${dr||'–'}).`);}
      else{const c1=ratio(A.g,A.c),c0=ratio(B.g,B.c);L.push(`<b>${nm(ref)}</b> frente a ${nm(pv)}: inversión <b>${dg||'–'}</b>, clics <b>${chg(A.c,B.c)||'–'}</b> y CPC <b>${c1==null?'–':eur(c1,2)}</b> (${chg(c1,c0)||'–'}; bajar es mejorar).`);}
    }
  }
  // canal
  const rc=rowsFor(p,['plat']),cg=groupAgg(rc,r=>r.s).filter(x=>x.a.g>=1);
  if(cg.length>=2){
    if(ventas){const o=cg.map(x=>({n:CH[x.k].n,v:ratio(x.a.sv,x.a.g)})).filter(x=>x.v!=null).sort((x,y)=>y.v-x.v);
      if(o.length>=2)L.push(`Por canal, el mayor ROAS es <b>${o[0].n} (${eur(o[0].v,2)})</b> y el menor <b>${o[o.length-1].n} (${eur(o[o.length-1].v,2)})</b>.`);}
    else{const o=cg.map(x=>({n:CH[x.k].n,v:ratio(x.a.g,x.a.c)})).filter(x=>x.v!=null).sort((x,y)=>x.v-y.v);
      if(o.length>=2)L.push(`Por canal, el CPC más bajo es <b>${o[0].n} (${eur(o[0].v,2)})</b> y el más alto <b>${o[o.length-1].n} (${eur(o[o.length-1].v,2)})</b>.`);}
  }
  // producto (solo total)
  if(p.type==='general'){const rp=rowsFor(p,['prod']),pg=groupAgg(rp,r=>r.prod).filter(x=>x.a.g>=1).map(x=>({n:x.k,v:ratio(x.a.sv,x.a.g),sv:x.a.sv,g:x.a.g})).filter(x=>x.v!=null).sort((x,y)=>y.v-x.v);
    if(pg.length>=2)L.push(`Por producto, el mayor ROAS es <b>${pg[0].n} (${eur(pg[0].v,2)})</b> y el menor <b>${pg[pg.length-1].n} (${eur(pg[pg.length-1].v,2)})</b>. El producto con más ventas es <b>${[...pg].sort((x,y)=>y.sv-x.sv)[0].n}</b>.`);}
  // campañas
  const cgp=groupAgg(rows,r=>r.ck+'|'+r.s).map(x=>({n:x.rr[0].n,s:x.rr[0].s,a:x.a}));
  if(ventas&&cgp.length){
    const t=[...cgp].sort((x,y)=>y.a.sv-x.a.sv)[0],sh=a.sv>0?t.a.sv/a.sv:0;
    L.push(`La campaña con más ventas aporta el <b>${pct(sh,1)}</b> del total (${eur(t.a.sv)} con ${eur(t.a.g)} invertidos, ROAS ${t.a.g>0?eur(t.a.sv/t.a.g,2):'–'}).${sh>=.3?' <b>Ojo: hay concentración en una sola campaña.</b>':''}`);
    const z=cgp.filter(x=>x.a.g>=1&&x.a.sv===0);
    if(z.length)L.push(`<b>${z.length}</b> ${z.length===1?'campaña ha invertido':'campañas han invertido'} <b>${eur(S(z.map(x=>x.a),'g'))}</b> sin ventas atribuidas.`);
  } else if(cgp.length){
    const t=[...cgp].sort((x,y)=>y.a.g-x.a.g)[0];
    L.push(`La campaña con más inversión concentra el <b>${a.g>0?pct(t.a.g/a.g,1):'–'}</b> del gasto (${eur(t.a.g)}).`);
  }
  return `<details class="ins"${state.insOpen?' open':''}><summary>Conclusiones principales</summary><ul>${L.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;
}
function scopeLine(p,rows){
  const ms=SEASON.filter(m=>rows.some(r=>r.m===m)).map(m=>MES_LARGO[SEASON.indexOf(m)]);
  const pr=[...new Set(rows.map(r=>r.prod))];
  const ch=[...new Set(rows.map(r=>r.s))].map(c=>CH[c].n);
  const meta=`<b>Meses:</b> ${ms.join(', ')||'–'} · <b>Canales:</b> ${ch.join(', ')||'–'}`;
  if(p.type==='general')return `<div class="scope"><b>Incluye:</b> ${GENERAL.map(x=>pr.includes(x)?x:`<span style="opacity:.5" title="sin datos todavía">${x}</span>`).join(', ')} · <b>No incluye (van por separado):</b> Patrocinadores, RRSS y Otros (Academia y sin clasificar) · ${meta}</div>`;

/* ---------- pestaña Comisiones: inversión total y comisiones de agencia ---------- */
function stackH(items,{W=430}={}){
  items=items.filter(i=>i.inv+i.com>0);if(!items.length)return '<div class="empty">Sin datos</div>';
  const rowH=44,Lw=130,Rw=165,bw=W-Lw-Rw-10,max=Math.max(...items.map(i=>i.inv+i.com)),tot=items.reduce((a,i)=>a+i.inv+i.com,0),H=items.length*rowH+6;
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  items.forEach((it,k)=>{const y=k*rowH+4,t=it.inv+it.com,wi=it.inv/max*bw,wc=it.com>0?Math.max(it.com/max*bw,3):0;
    const tid=tp(`<b>${esc(it.label)}</b><br>Inversión en medios: ${eur(it.inv)}<br>Comisión: ${eur(it.com)}<br><b>Total: ${eur(t)}</b> (${pct(t/tot)} del total)`);
    const lb=it.label.length>20?it.label.slice(0,19)+'…':it.label;
    o+=`<text x="${Lw-8}" y="${y+rowH/2+1}" text-anchor="end" font-size="12" fill="var(--ink2)">${esc(lb)}</text>`;
    if(it.inv>0)o+=`<rect x="${Lw}" y="${y+8}" width="${wi}" height="22" rx="3" fill="${it.color||'var(--inv)'}"/>`;
    if(wc)o+=`<rect x="${Lw+wi}" y="${y+8}" width="${wc}" height="22" rx="3" fill="var(--com)"/>`;
    o+=`<text x="${W-Rw+8}" y="${y+19}" font-size="16" class="fig">${eur(t)}</text><text x="${W-Rw+8}" y="${y+34}" font-size="11" fill="var(--muted)">${eur(it.inv)} + ${eur(it.com)} · ${pct(t/tot,1)}</text>`;
    o+=`<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent" data-tip="${tid}"/>`;});
  return o+'</svg>';
}

document.addEventListener('click',e=>{
  const th=e.target.closest&&e.target.closest('th[data-sort]');
  if(th){const i=th.dataset.sort.indexOf(':'),id=th.dataset.sort.slice(0,i),k=th.dataset.sort.slice(i+1),c=SORT[id];
    SORT[id]=c&&c.k===k?{k,d:-c.d}:{k,d:th.dataset.t==='n'?-1:1};
    const y=window.scrollY;render();window.scrollTo(0,y);return;}
  const cr=e.target.closest&&e.target.closest('[data-camp]');
  if(cr){state.camp=state.camp===cr.dataset.camp?'':cr.dataset.camp;render();return;}
  const x=e.target.closest&&e.target.closest('[data-x]');
  if(x){const i=x.dataset.x.indexOf(':'),d=x.dataset.x.slice(0,i),k=x.dataset.x.slice(i+1);const S_=SETS[d];S_.has(k)?S_.delete(k):S_.add(k);render();return;}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.clear){const i=t.dataset.clear.indexOf(':');SETS[t.dataset.clear.slice(0,i)].delete(t.dataset.clear.slice(i+1));}
  else if(t.dataset.page){state.page=t.dataset.page;state.camp='';state.prods.clear();state.pats.clear();state.tipos.clear();}
  else if(t.dataset.month){const m=t.dataset.month;state.months.has(m)?state.months.delete(m):state.months.add(m);}
  else if(t.dataset.plat){const c=t.dataset.plat;state.plats.has(c)?state.plats.delete(c):state.plats.add(c);}
  else if(t.dataset.tmode){state.trendMode=t.dataset.tmode;const y=window.scrollY;render();window.scrollTo(0,y);return;}
  else if(t.dataset.trend){state.trend=t.dataset.trend;const y=window.scrollY;render();window.scrollTo(0,y);return;}
  else if(t.dataset.campall){state.campAll=!state.campAll;}
  else if(t.id==='reset'){state.months.clear();state.plats.clear();state.prods.clear();state.pats.clear();state.tipos.clear();state.camp='';}
  else return;
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){[state.prods,state.pats,state.tipos,state.months,state.plats].forEach(s=>s.clear());render();}});
document.addEventListener('change',e=>{if(e.target.id==='campSel'){state.camp=e.target.value;render();}});
window.__dash={ENR,PAGES,GENERAL,state,pageRows,agg,render,EXCEL_TOTALS};
render();

/* ---------- tema claro/oscuro + imprimir ---------- */
(function(){
  const root=document.documentElement;
  let th='dark';try{th=localStorage.getItem('pm_theme')||'dark';}catch(e){}
  const apply=v=>{root.setAttribute('data-theme',v);th=v;try{localStorage.setItem('pm_theme',v);}catch(e){} if(window.__dash&&window.__dash.render)window.__dash.render();};
  root.setAttribute('data-theme',th);
  document.getElementById('themeBtn').onclick=()=>apply(th==='dark'?'light':'dark');
  let prevTheme=null;
  window.addEventListener('beforeprint',()=>{prevTheme=root.getAttribute('data-theme');root.setAttribute('data-theme','light');});
  window.addEventListener('afterprint',()=>{if(prevTheme)root.setAttribute('data-theme',prevTheme);prevTheme=null;});
  document.getElementById('printBtn').onclick=()=>print();
})();
</script>
</body>
</html>
